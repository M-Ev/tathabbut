<h1 class="article-title article-title--primary"> ما حكم الزواج بنية الطلاق؟ </h1>
<h2 class="article-title article-title__question article-title--primary" itemprop="alternativeHeadline">
<i class="fa fa-question-circle"></i><p><strong>السؤال:</strong></p><p>الزواج بنية الطلاق؟</p></h2>
<div itemprop="articleBody" class="article-content"><p><strong>الجواب:</strong></p>
<p>عند الجمهور لا بأس، وتركه أوْلى، الأكثرون يقولون لا بأس، هذا شيء بينه وبين ربه.<br /> س: فعلهم صحيح؟<br /> الشيخ: الجمهور يرون جواز هذا، والأحوط تركه.</p>
